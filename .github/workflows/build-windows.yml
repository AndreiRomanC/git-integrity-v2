name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Clean never copies build inputs into Git metadata
        shell: pwsh
        env:
          CARGO_TARGET_DIR: .build-windows
          CARGO_INCREMENTAL: "0"
        run: |
          cargo test --release --manifest-path src-tauri/Cargo.toml --lib repository::branches::tests::all_clean_entrypoints_leave_no_build_input_copies_in_recursive_git_metadata -- --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Clean source-backup regression check failed; executable will not be published." }

      - name: Verify background commands do not create a console
        shell: pwsh
        env:
          CARGO_TARGET_DIR: .build-windows
          CARGO_INCREMENTAL: "0"
        run: |
          cargo test --release --manifest-path src-tauri/Cargo.toml --lib repository::background_process::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Background console regression check failed." }

      - name: Verify native Publish on Windows (local fixtures only)
        shell: pwsh
        env:
          CARGO_TARGET_DIR: .build-windows
          CARGO_INCREMENTAL: "0"
        run: |
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib repository::publish_diagnostics::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Native push diagnostics or process-lifecycle regression." }

      - name: Build portable executable
        shell: pwsh
        run: ./build-windows.ps1

      - name: Verify executable size and GUI subsystem
        shell: pwsh
        run: |
          $exe = Get-Item "dist/windows/GitDrillDown.exe"
          if ($exe.Length -gt 30MB) { throw "Executable exceeds 30 MB" }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x4550) { throw "Invalid Windows executable" }
          # Subsystem is 68 bytes into the optional header, for both PE32 and PE32+.
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) { throw "Release executable must use the Windows GUI subsystem, not Console" }
          Write-Host "Windows executable: $([math]::Round($exe.Length / 1MB, 2)) MB"

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: git-drilldown-windows
          path: dist/windows/GitDrillDown.exe
          if-no-files-found: error
